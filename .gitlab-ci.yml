# Same steps as .github/workflows/ci.yml. SystemC is built as C++20 from subprojects/systemc.wrap
# by `meson setup` (distro packages may use another standard, which fails at link time); the wrap
# downloads and ccache are cached.
image: ubuntu:24.04

stages:
    - build
    - test
    - deploy

variables:
    # Full clone: the version comes from `git describe --tags` (utils/git-version.sh)
    GIT_DEPTH: "0"
    DEBIAN_FRONTEND: noninteractive
    MESON_VERSION: "1.11.2"
    # CC too: the SystemC subproject compiles C and assembly (QuickThreads) with it. ccache: Meson
    # only adds it by itself when CC/CXX are unset.
    CC: ccache gcc
    CXX: ccache g++
    CCACHE_DIR: $CI_PROJECT_DIR/.ccache
    CCACHE_MAXSIZE: 500M

default:
    before_script:
        - apt-get update
        - apt-get install -y --no-install-recommends
          ca-certificates git g++ cmake ninja-build flex bison ccache
          python3 python3-venv doxygen graphviz
        - python3 -m venv /opt/meson
        - /opt/meson/bin/pip install "meson==${MESON_VERSION}"
        - export PATH="/opt/meson/bin:$PATH"
    # Meson checks the wrap hashes, so a changed wrap just downloads its new tarball
    cache:
        key: wraps-ccache-ubuntu24.04-gcc
        paths:
            - subprojects/packagecache/
            - .ccache/

# specs and libspx.so need libsystemc.so.3.0 at run time: it is shipped in the artefacts
# (build/subprojects/systemc-*/), use LD_LIBRARY_PATH to run them elsewhere.
build:
    stage: build
    script:
        - meson setup build -Dnative=false -Dspx=true
        - meson compile -C build
    artifacts:
        paths:
            - build/specs
            - build/libspx.so
            - build/subprojects/systemc-*/libsystemc.so*
        expire_in: 1 week

# A build dir does not survive being passed as an artefact (fresh checkout timestamps, absolute
# paths, gtest wrap sources outside build/), so the test job configures and builds its own.
test:
    stage: test
    needs: [build]
    script:
        - meson setup build -Dnative=false
        - meson test -C build --print-errorlogs
    artifacts:
        when: always
        paths:
            - build/meson-logs/
            - build/traces/*.vcd

doc:
    stage: build
    script:
        - meson setup build -Dnative=false -Dtests=disabled
        - ninja -C build doc
    artifacts:
        paths:
            - build/doc/html/
    only:
        - master

pages:
    stage: deploy
    needs: [doc]
    before_script: []
    cache: []
    script:
        - mkdir public
        - cp -R build/doc/html/* public
    artifacts:
        paths:
            - public
    only:
        - master
