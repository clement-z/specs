# Same steps as .github/workflows/ci.yml. SystemC is built from the thirdparty/systemc submodule
# as C++20 (distro packages may use another standard, which fails at link time) and cached.
image: ubuntu:24.04

stages:
    - build
    - test
    - deploy

variables:
    # Recursive submodule update
    GIT_SUBMODULE_STRATEGY: recursive
    DEBIAN_FRONTEND: noninteractive
    MESON_VERSION: "1.11.2"
    SYSTEMC_PREFIX: $CI_PROJECT_DIR/.deps/systemc

default:
    before_script:
        - apt-get update
        - apt-get install -y --no-install-recommends
          ca-certificates git g++ cmake ninja-build flex bison
          python3 python3-venv doxygen graphviz
        - python3 -m venv /opt/meson
        - /opt/meson/bin/pip install "meson==${MESON_VERSION}"
        - export PATH="/opt/meson/bin:$PATH"
        # No-op when the cache already holds this SystemC commit built by this compiler
        - utils/build-systemc.sh "$SYSTEMC_PREFIX" .deps/systemc-build
    cache:
        key: systemc-ubuntu24.04-gcc
        paths:
            - .deps/systemc

# specs and libspx.so need libsystemc.so.3.0 at run time: it is shipped in the artefacts
# (.deps/systemc/lib*/), use LD_LIBRARY_PATH to run them elsewhere.
build:
    stage: build
    script:
        - meson setup build -Dnative=false -Dspx=true -Dcmake_prefix_path="$SYSTEMC_PREFIX"
        - meson compile -C build
    artifacts:
        paths:
            - build/specs
            - build/libspx.so
            - .deps/systemc/lib*/libsystemc.so*
        expire_in: 1 week

# A build dir does not survive being passed as an artefact (fresh checkout timestamps, absolute
# paths, gtest wrap sources outside build/), so the test job configures and builds its own.
test:
    stage: test
    needs: [build]
    script:
        - meson setup build -Dnative=false -Dcmake_prefix_path="$SYSTEMC_PREFIX"
        - meson test -C build --print-errorlogs
    artifacts:
        when: always
        paths:
            - build/meson-logs/
            - build/traces/*.vcd

doc:
    stage: build
    script:
        - meson setup build -Dnative=false -Dcmake_prefix_path="$SYSTEMC_PREFIX" -Dtests=disabled
        - ninja -C build doc
    artifacts:
        paths:
            - build/doc/html/
    only:
        - master

pages:
    stage: deploy
    needs: [doc]
    before_script: []
    cache: []
    script:
        - mkdir public
        - cp -R build/doc/html/* public
    artifacts:
        paths:
            - public
    only:
        - master
