# Optional development environment (https://pixi.sh): compilers, build tools, Python and the docs
# tools from conda-forge, pinned in pixi.lock. The plain route (system compilers, `meson setup build`)
# stays supported; see README.md, "Development environment (pixi, optional)".
#   pixi run test              # configure + build + meson test in build-pixi/gcc
#   pixi run test clang        # same with clang, in build-pixi/clang (also: asan-gcc, asan-clang)
#   pixi run golden            # the golden check of AGENTS.md on build-pixi/gcc
#   pixi shell                 # a shell with the environment (CC/CXX: ccache + gcc on Linux)
# Binaries built here use the environment's libstdc++ (rpath into .pixi/envs/default/lib): they run
# directly while the environment exists, not on a machine without it.

[workspace]
name = "specs"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[dependencies]
# Compiler majors: those of conda-forge's global pinning on 2026-10-21 (gcc 15, clang 21). Plain
# compiler packages, not cxx-compiler/gxx_linux-64/clang_linux-64, whose activation scripts export
# CFLAGS/CXXFLAGS/LDFLAGS (-O2, -march=..., ...) that Meson would pick up.
clang = "21.*"
clangxx = "21.*"
compiler-rt = "21.*"      # clang's sanitizer runtimes
clang-format = "21.*"
meson = ">=1.3"
ninja = "*"
cmake = "*"               # the SystemC subproject is built through Meson's CMake module
pkg-config = "*"
flex = "*"
bison = ">=3"
python = "3.12.*"
ccache = "*"

[target.linux.dependencies]
gcc = "15.*"
gxx = "15.*"
libsanitizer = "15.*"     # gcc's sanitizer runtimes
gdb = "*"

[target.osx.dependencies]
lldb = "21.*"

[activation.env]
# One ccache for all worktrees: paths under the worktree are hashed relative to it, and the
# working directory is not hashed for debug builds. ccache's own default cache directory is used.
CCACHE_BASEDIR = "$PIXI_PROJECT_ROOT"
CCACHE_NOHASHDIR = "1"
# One wrap download cache (SystemC, args, gtest) for all worktrees instead of each
# subprojects/packagecache/ (Meson >= 1.3; the wraps' hashes are still checked).
MESON_PACKAGE_CACHE_DIR = "${XDG_CACHE_HOME:-$HOME/.cache}/specs/meson-packagecache"

# For a plain `meson setup` in `pixi shell`: the environment's `cc` is gcc but its `c++` is clang,
# so name both. CC too: the SystemC subproject compiles C and assembly with it. Naming ccache
# keeps it in use (Meson only adds it by itself when CC/CXX are unset).
[target.linux.activation.env]
CC = "ccache gcc"
CXX = "ccache g++"

[target.osx.activation.env]
CC = "ccache clang"
CXX = "ccache clang++"

# Build directories: build-pixi/<toolchain>, never the plain route's build/ (a build directory keeps
# the compilers it was configured with; utils/pixi-setup.sh refuses one configured elsewhere).
# Toolchains: gcc (default), clang, asan-gcc, asan-clang. Extra Meson options after `--`, used when
# the directory is created: pixi run setup gcc -- -Dspx=true
[tasks.setup]
description = "Configure build-pixi/<toolchain> (gcc, clang, asan-gcc, asan-clang)"
args = [{ arg = "toolchain", default = "gcc" }]
cmd = "sh utils/pixi-setup.sh {{ toolchain }}"

[tasks.build]
description = "Build build-pixi/<toolchain>"
args = [{ arg = "toolchain", default = "gcc" }]
cmd = "meson compile -C build-pixi/{{ toolchain }}"
depends-on = [{ task = "setup", args = ["{{ toolchain }}"] }]

[tasks.test]
description = "meson test in build-pixi/<toolchain> (unit, golden, legacy testbenches)"
args = [{ arg = "toolchain", default = "gcc" }]
cmd = "meson test -C build-pixi/{{ toolchain }} --print-errorlogs"
depends-on = [{ task = "build", args = ["{{ toolchain }}"] }]

[tasks.golden]
description = "Golden check of build-pixi/<toolchain> (the run_golden.py line of AGENTS.md)"
args = [{ arg = "toolchain", default = "gcc" }]
cmd = """python -I tests/golden/run_golden.py check --specs build-pixi/{{ toolchain }}/specs \
--unit-tests build-pixi/{{ toolchain }}/src/test/unit_tests --baseline tests/golden/baseline -j 8"""
depends-on = [{ task = "build", args = ["{{ toolchain }}"] }]
# Sanitizer builds need the suppressions that meson test applies (no effect on other builds).
env = { LSAN_OPTIONS = "suppressions=$PIXI_PROJECT_ROOT/tests/sanitizers/lsan.supp:print_suppressions=0" }

# pyspecs (Python wrapper, notebooks). Keep in sync with pyspecs/requirements.txt (pip users):
# both lists must name the same packages.
[feature.py.dependencies]
python = "3.12.*"
numpy = "*"
pandas = "*"
matplotlib-base = "*"     # matplotlib without the Qt backend (Tk and Jupyter backends work)
jupyterlab = "*"

[feature.py.pypi-dependencies]
pyDigitalWaveTools = ">=1.2"

[feature.docs.dependencies]
doxygen = "*"
graphviz = "*"

[feature.docs.tasks.docs]
description = "Doxygen HTML in build-pixi/doc/html"
cmd = "sh utils/doc.sh doxygen . build-pixi/doc"

# py and docs need no compilers: they leave out the default feature.
[environments]
py = { features = ["py"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
